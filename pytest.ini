[pytest]
testpaths = tests
pythonpath = . tests
# Par défaut on exclut :
# - `network` : consomme du quota free tier Gemini (texte + embeddings),
#   planterait la CI sans secret. Lancer explicitement avec `-m network`.
# Les markers `ocr` et `real` restent inclus par défaut.
# Les tests d'index tournent par défaut avec un faux encodeur
# déterministe (`EncodeurFake`), donc pas de marker dédié.
addopts = -m "not network"
markers =
    ocr: test nécessitant Tesseract OCR (fra + eng)
    real: test utilisant un bilan réel publié
    network: test tapant une API externe (clé GEMINI_API_KEY requise)
