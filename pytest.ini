[pytest]
testpaths = tests
pythonpath = . tests
# Par défaut on exclut les tests `network` : ils consomment du quota free
# tier (250 RPD) et planteraient la CI sans secret. Pour les lancer,
# ajouter explicitement `-m network` (cela écrase ce `-m "not network"`).
# Les markers `ocr` et `real` restent inclus par défaut.
addopts = -m "not network"
markers =
    ocr: test nécessitant Tesseract OCR (fra + eng)
    real: test utilisant un bilan réel publié
    network: test tapant une API externe (clé GEMINI_API_KEY requise)
