name: tests

on:
  push:
    branches: ["main", "fiabilisation"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Tesseract OCR 5.x (fra + eng)
        # Dépôts stables d'Ubuntu : Tesseract 4.1. Les bounding boxes
        # retournées par image_to_data sont moins précises qu'en 5.x, ce
        # qui déstabilise le regroupement par colonnes sur un bilan
        # 3-colonnes (SOTUVER scanné). On installe donc la 5.x via le
        # PPA alex-p/tesseract-ocr-devel pour aligner CI et poste local
        # (UB-Mannheim 5.4 sous Windows).
        run: |
          sudo add-apt-repository -y ppa:alex-p/tesseract-ocr-devel
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-fra \
            tesseract-ocr-eng \
            poppler-utils
          tesseract --version
          tesseract --list-langs

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest -v --maxfail=5
